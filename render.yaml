services:
  - type: web
    name: buildmate-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install && npx prisma db push && node prisma/seed.js
    startCommand: cd backend && node src/server.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: buildmate-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000

databases:
  - name: buildmate-db
    databaseName: buildmate
    user: buildmate_user
    plan: free
